services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weathernet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only django and grafana, both on the
    # weathernet network, need to reach it.

  django:
    build: ./django_app
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS}
      TELEMETRY_COMPRESS_AFTER_DAYS: ${TELEMETRY_COMPRESS_AFTER_DAYS}
      # Zero-touch enrollment (PROJECT_SPEC.md Section 5.7): needed to
      # sign CSRs, allocate WireGuard tunnel IPs, and build the enroll
      # response / the admin's printed setup command.
      ENROLLMENT_TOKEN_TTL_MINUTES: ${ENROLLMENT_TOKEN_TTL_MINUTES}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP}
      WIREGUARD_SUBNET: ${WIREGUARD_SUBNET}
      WIREGUARD_LISTEN_PORT: ${WIREGUARD_LISTEN_PORT}
    volumes:
      # Read-only. The CA key is the one meaningful new attack-surface
      # trade-off enrollment introduces -- signing CSRs synchronously
      # inside this view is what needs it. See PROJECT_SPEC.md Section
      # 5.5/5.7 for the reasoning, and scripts/setup.sh for how its host
      # file permissions are kept from being world-readable.
      - ./pki/ca/ca.key.pem:/etc/weathernet/pki/ca.key.pem:ro
      - ./pki/ca/ca.cert.pem:/etc/weathernet/pki/ca.cert.pem:ro
      # Public only -- read to compute the fingerprint admin.py prints
      # for the probe's optional TLS pinning.
      - ./pki/server/server.cert.pem:/etc/weathernet/pki/server.cert.pem:ro
      # Public only -- handed back to a probe during enrollment so it
      # can render its own wg0.conf.
      - ./wireguard/server_public.key:/etc/weathernet/wireguard/server_public.key:ro
      # Public only -- the VM's own SSH public key, handed to a probe
      # during enrollment so the server can SSH into it directly, no
      # manual key copying. Host path configurable (see .env.example);
      # best-effort on the Django side if this doesn't resolve to a real
      # file (see probes/wireguard.py) -- enrollment must not fail
      # because of it.
      - ${SERVER_SSH_PUBLIC_KEY_HOST_PATH}:/etc/weathernet/ssh/id_ed25519.pub:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weathernet
    # Deliberately not published to the host -- the ingestion path is
    # only reachable through nginx's mTLS-terminating proxy (see
    # PROJECT_SPEC.md Section 3).

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./pki/ca/ca.cert.pem:/etc/weathernet/pki/ca.cert.pem:ro
      - ./pki/server/server.cert.pem:/etc/weathernet/pki/server.cert.pem:ro
      - ./pki/server/server.key.pem:/etc/weathernet/pki/server.key.pem:ro
    depends_on:
      - django
    networks:
      - weathernet

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Consumed by grafana/provisioning/datasources/postgres.yml, which
      # Grafana expands at startup -- kept out of that file directly so
      # the read-only DB credentials stay in .env like everything else.
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weathernet
    # Published on its own port for the operator's dashboard access
    # (PROJECT_SPEC.md Section 5.1) -- separate from the mTLS ingestion
    # path, which only nginx handles.

networks:
  weathernet:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:

# WireGuard remote access (see wireguard/) is deliberately not a service
# here: giving a container the NET_ADMIN capability (or --privileged) to
# create a wg0 interface is extra complexity for no real benefit. It
# runs directly on the VM host via wg-quick/systemd instead -- see
# PROJECT_SPEC.md Section 5.1.
