version: '3'
services:
  timescaledb:
    container_name: weather_timescaledb
    restart: unless-stopped
    image: timescale/timescaledb:2.16.1-pg16
    command: postgres -c shared_preload_libraries=timescaledb
    shm_size: 128mb
    networks:
      - weather_network
    ports:
      - "5432:5432"
    environment:
      - PGDATA=/var/lib/postgresql/data/timescaledb
      - POSTGRES_DB=weather
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    volumes:
      - weather_timescaledb_data:/var/lib/postgresql/data/timescaledb
      - /root/server_certs/server.cert.pem:/var/lib/pgsql/data/server.crt
      - /root/server_certs/server.key.pem:/var/lib/pgsql/data/server.key
      - /root/mtls/certs/cacert.pem:/var/lib/pgsql/data/root.crt
  grafana:
    container_name: weather_grafana
    restart: unless-stopped
    image: grafana/grafana:11.2.0
    networks:
      - weather_network
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_NAME=Viewer
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SECURITY_ADMIN_USER=$GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD=$GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - weather_grafana_data:/var/lib/grafana
networks:
  weather_network:
    driver: bridge
volumes:
  weather_timescaledb_data:
  weather_grafana_data:
