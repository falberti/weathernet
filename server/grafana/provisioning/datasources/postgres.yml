apiVersion: 1

datasources:
  - name: WeatherNet Postgres
    uid: weathernet_postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: $POSTGRES_DB
    user: $GRAFANA_DB_USER
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    isDefault: true
    editable: false
